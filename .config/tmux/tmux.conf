# ============================================================================
# tmux configuration
# Sessions: auto-attach on SSH + `ta [name]` (see ~/.bashrc.d/00-tmux)
# ============================================================================

# Terminal & colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g escape-time 10          # snappy Esc for nvim / vi mode
set -g focus-events on         # nvim autoread
set -g set-clipboard on        # OSC 52 — yank reaches the local clipboard over SSH

# General
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#h: #S"

# Several clients on one session (SSH + local, alternating)
# Window follows the size of the client that was used last
set -g window-size latest
setw -g aggressive-resize on
set -ga update-environment " WAYLAND_DISPLAY"

# Key bindings
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Theme (optional, provided by hyprdsktp)
source-file -q ~/.config/tmux/theme.conf

# Show host next to session — essential when working on several machines
set -g status-left " #S @ #h "
set -g status-left-length 40
