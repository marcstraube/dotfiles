# ============================================================================
# tmux configuration
# Sessions: auto-attach on SSH + `ta [name]` (see ~/.bashrc.d/00-tmux)
# ============================================================================

# Terminal & colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:hyperlinks"   # pass OSC 8 links through
set -s extended-keys always    # forward Ctrl/Shift+Enter etc. (Claude Code newline)
set -s extended-keys-format csi-u
set -g escape-time 10          # snappy Esc for nvim / vi mode
set -g focus-events on         # nvim autoread
set -g set-clipboard on        # OSC 52 — yank reaches the local clipboard over SSH

# General
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#h: #S"

# Several clients on one session (SSH + local, alternating)
# Window follows the size of the client that was used last
set -g window-size latest
setw -g aggressive-resize on
set -ga update-environment " WAYLAND_DISPLAY"

# Key bindings
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Ctrl+click opens links. With `mouse on` clicks never reach the terminal, so
# tmux opens them itself: OSC 8 hyperlinks first, else a plain URL under the
# cursor. #{q:...} shell-escapes, so a crafted link cannot inject commands.
bind -n C-MouseDown1Pane run-shell -b '\
    u=#{q:mouse_hyperlink}; \
    [ -z "$u" ] && case #{q:mouse_word} in http://*|https://*) u=#{q:mouse_word} ;; esac; \
    [ -n "$u" ] && xdg-open "$u" >/dev/null 2>&1; true'

# Theme (optional, provided by hyprdsktp)
source-file -q ~/.config/tmux/theme.conf

# Claude Code state per window (set by ~/.claude/hooks/tmux-state.sh):
# cog = working, bell = waiting for you, check = done, x = error
setw -g window-status-format " #I:#W#{?@claude, #{@claude},} "
setw -g window-status-current-format " #I:#W#{?@claude, #{@claude},} "
# "done" has been seen once you visit the window
set-hook -g after-select-window 'if -F "#{==:#{@claude_state},done}" "set -wu @claude ; set -wu @claude_state"'

# Show host next to session — essential when working on several machines
set -g status-left " #S @ #h "
set -g status-left-length 40
