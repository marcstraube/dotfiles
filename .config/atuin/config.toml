## Atuin — shell history configuration
## Docs: https://docs.atuin.sh/configuration/config/

# Search
search_mode = "fuzzy"
filter_mode = "global"

# UI — compact, minimal chrome
style = "compact"
inline_height = 30
show_preview = true
show_help = false
show_tabs = false
enter_accept = true
invert = false
prefers_reduced_motion = false

# Keymap — match shell vi mode (03-options: set -o vi)
keymap_mode = "vim-insert"

# Storage
store_failed = true
secrets_filter = true

# Filter — mirror HISTIGNORE from 02-history
history_filter = [
    "^ls$",
    "^ll$",
    "^la$",
    "^cd$",
    "^pwd$",
    "^exit$",
    "^date$",
    "^clear$",
    "^history",
]

# Sync — disabled (local only)
auto_sync = false
update_check = false
