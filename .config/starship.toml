# ============================================================================
# Starship Prompt Configuration
# https://starship.rs/config/
# ============================================================================

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for commands (milliseconds)
command_timeout = 1000

# Format
format = """
[╭─](bold green)$username$hostname$directory$git_branch$git_status$git_commit$git_state
[╰─](bold green)$character"""

# Right prompt
right_format = """$cmd_duration$jobs$time"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[←](bold green)"

[username]
format = "[$user]($style)@"
style_user = "bold cyan"
style_root = "bold red"
show_always = true

[hostname]
format = "[$hostname]($style) in "
style = "bold blue"
ssh_only = false

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = ".../"
read_only = " 󰌾"

[directory.substitutions]
"~/Code" = " "
"~/Documents" = "󰈙 "
"~/Downloads" = " "
"~/.config" = " "

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_commit]
format = '[\($hash$tag\)]($style) '
style = "bold green"
tag_symbol = " 🏷  "
tag_disabled = false
only_detached = true

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "took [$duration]($style) "
style = "bold yellow"
min_time = 2000

[time]
format = "[$time]($style) "
style = "bold white"
disabled = false
time_format = "%H:%M"

[jobs]
format = "[$symbol$number]($style) "
style = "bold blue"
symbol = "✦"

# Language-specific modules
[nodejs]
format = "via [$symbol($version )]($style)"
symbol = " "

[python]
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = " "

[rust]
format = "via [$symbol($version )]($style)"
symbol = " "

[php]
format = "via [$symbol($version )]($style)"
symbol = " "

[docker_context]
format = "via [$symbol$context]($style) "
symbol = " "

# Disable modules you don't need
[aws]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true
